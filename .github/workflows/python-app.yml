name: CI - Inventario Equipos de Computo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: pip install sqlalchemy

    - name: Verificar sintaxis del codigo base
      run: python -m py_compile Inventario.py

    - name: Verificar sintaxis del codigo optimizado
      run: python -m py_compile Inventario_Optimizado.py

    - name: Verificar sintaxis del ORM
      run: python -m py_compile inventario_orm.py

    - name: Ejecutar pruebas unitarias
      run: python -m unittest test_inventario.py -v

    - name: Mostrar version de Python
      run: python --version
